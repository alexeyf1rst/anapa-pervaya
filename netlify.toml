[build]
  publish = "."

[[redirects]]
  from = "/politika"
  to = "/politika.html"
  status = 200

[[redirects]]
  from = "/soglasie"
  to = "/soglasie.html"
  status = 200

[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"
